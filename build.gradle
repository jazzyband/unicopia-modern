buildscript {
    dependencies {
        classpath 'com.github.dexman545:Outlet:1.6.1'
    }
}
plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
    id 'com.modrinth.minotaur' version '2.+'
    id 'org.ajoberstar.reckon' version '0.13.1'
}
apply plugin: 'io.github.dexman545.outlet'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

sourceSets.main.java.exclude 'com/minelittlepony/unicopia/compat/tla/**'
sourceSets.main.java.exclude 'com/minelittlepony/unicopia/compat/trinkets/TrinketsDelegateImpl.java'
sourceSets.main.java.exclude 'com/minelittlepony/unicopia/compat/trinkets/SpellbookTrinketSlot.java'
sourceSets.main.java.exclude 'com/minelittlepony/unicopia/compat/trinkets/UnicopiaTrinket.java'
sourceSets.test.java.exclude 'com/minelittlepony/unicopia/datagen/importers/**'
tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.named('sourcesJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

outlet.allowSnapshotsForProject = false
outlet.mcVersionRange = project.minecraft_version_range

group = project.group
description = project.displayname
base.archivesName = project.name

loom {
    accessWidenerPath = file('src/main/resources/unicopia.aw')
}

fabricApi {
    configureDataGeneration {
        modId = 'unicopia'
        client = true
    }
}

reckon {
    scopeFromProp()
    stageFromProp 'beta', 'rc', 'final'
}

repositories {
    mavenLocal()
    flatDir { dirs 'lib' }
    maven { name 'mod-menu'; url 'https://maven.terraformersmc.com/' }
    maven { name 'minelp-snapshot'; url 'https://repo.minelittlepony-mod.com/maven/snapshot' }
    maven { name 'minelp-releases'; url 'https://repo.minelittlepony-mod.com/maven/release' }

    maven { name 'REI'; url 'https://maven.shedaniel.me/' }

    maven { name 'accessories-a'; url 'https://maven.wispforest.io/releases' }
    maven { name 'accessories-b'; url 'https://maven.su5ed.dev/releases' }
    
    maven { name 'Iris Deps'; url "https://maven.covers1624.net/" }
    maven { name 'Greenhouse Maven For Farmers delight'; url 'https://maven.greenhouse.lgbt/releases/' }
    maven { name 'Porting Lib For Farmers delight'; url = 'https://mvn.devos.one/releases/' }
    maven { name 'Modrinth'; url 'https://api.modrinth.com/maven' }
    maven { name 'JitPack'; url 'https://jitpack.io'; content { includeGroup "com.github.Virtuoel" } }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    api "net.fabricmc:fabric-loader:${project.loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    api "com.minelittlepony:minelittlepony:${project.minelp_version}"

    api "com.minelittlepony:kirin:${project.kirin_version}"
    include "com.minelittlepony:kirin:${project.kirin_version}"

    api "com.sollace:fabwork:${project.fabwork_version}"
    include "com.sollace:fabwork:${project.fabwork_version}"

    compileOnly "com.sollace:Romanizer:Romanizer:1.0.2"
    include "com.sollace:Romanizer:Romanizer:1.0.2"

    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    if (project.use_farmers_delight == '1') {
      implementation "maven.modrinth:farmers-delight-refabricated:${project.farmers_delight_version}", {
        exclude group: "net.fabricmc"
      }
    }
    if (project.use_pehkui == '1') {
      compileOnly "maven.modrinth:pehkui:${project.pehkui_version}", { exclude group: "net.fabricmc.fabric-api" }
      compileOnly "com.github.Virtuoel:KanosConfig:0.4.1", { exclude group: "net.fabricmc.fabric-api" }
    }

    if (project.use_sodium == '1') {
      compileOnly "maven.modrinth:indium:${project.indium_version}", { exclude group: "net.fabricmc.fabric-api" }
      compileOnly "maven.modrinth:sodium:${project.sodium_version}", { exclude group: "net.fabricmc.fabric-api" }
      if (project.use_iris == '1') {
        compileOnly "maven.modrinth:iris:${project.iris_version}", { exclude group: "net.fabricmc.fabric-api" }
        implementation "org.anarres:jcpp:1.4.14"
        implementation "org.antlr:antlr4-runtime:4.13.1"
        implementation "io.github.douira:glsl-transformer:2.0.1"
      }
    }

    if (project.tmi_type == 'emi') {
      compileOnly "dev.emi:emi-fabric:${project.emi_version}"
    }
    if (project.tmi_type == 'rei') {
      compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}"
      compileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
      compileOnly "dev.architectury:architectury-fabric:${project.rei_architectury_version}"
      //modCompileOnly "me.shedaniel.cloth:basic-math:${project.rei_cloth_basic_math_version}"
      compileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.rei_cloth_config_version}"
    }
}

processResources {
    inputs.property "version", project.version.toString()

    filesMatching("fabric.mod.json") {
        expand "version": project.version.toString(),
                "minecraftVersion": project.minecraft_version_range,
                "loaderVersion": ">=${project.loader_version}",
                "fabricVersion": ">=${project.fabric_version}",
                "fabworkVersion": ">=${project.fabwork_version}",
                "kirinVersion": ">=${project.kirin_version}"
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

tasks.modrinth {
    onlyIf {
      def stage = version.version.stage.value
      stage == null || stage.name != 'beta'
    }
}

modrinth {
    token = System.env.MODRINTH_KEY
    projectId = project.modrinth_project_id
    //featured = true
    versionNumber = version.toString()
    versionName = project.name + '-' + version
    changelog = "[Changelog](https://github.com/Sollace/Unicopia/releases/tag/${version.toString()})"
    loaders = ['fabric', 'quilt']
    uploadFile = jar
    outlet.mcVersions().each{ver ->
      gameVersions.add ver
    }
    dependencies {
       required.project 'P7dR8mSH'
       optional.project '5aaWibi9'
       optional.project 'JBjInUXM'
       optional.project 'fRiHVvU7'
    }
}


publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            pom {
                name = "Unicopia"
                description = "Pony abilities mod for minecraft"
                licenses {
                    license {
                        name = "MIT Public License"
                        url = "https://tlo.mit.edu/learn-about-intellectual-property/software-and-open-source-licensing"
                    }
                }
                developers {
                    developer {
                        id = "sollace"
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/Sollace/Unicopia.git'
                    developerConnection = 'scm:git:ssh://github.com/Sollace/Unicopia.git'
                    url = 'https://github.com/Sollace/Unicopia'
                }
            }
        }
    }
}

